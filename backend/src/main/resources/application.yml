spring:
  application:
    name: ai-tms
  datasource:
    # H2 파일 모드 — DB 파일은 backend/data/ 아래 생성 (git 제외)
    url: jdbc:h2:file:./data/aitms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always   # schema.sql 추가 시 기동마다 실행 (CREATE TABLE IF NOT EXISTS 사용)
  servlet:
    multipart:
      max-file-size: 5MB      # 엑셀 업로드
      max-request-size: 5MB
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

server:
  port: 8080

app:
  ai:
    llm:
      enabled: true                 # false면 AI 생성(LLM) 추천을 건너뜀 (규칙기반·RAG만)
      model: claude-opus-5
      max-cases: 5                  # 요구사항 1건당 제안할 최대 TC 수
      api-key: ${ANTHROPIC_API_KEY:}  # 비우면 SDK 기본 인증(ANTHROPIC_API_KEY 환경변수 / ant auth login 프로필) 사용
  cors:
    allowed-origins: http://localhost:5173
