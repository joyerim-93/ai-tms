spring:
  application:
    name: ai-tms
  datasource:
    # H2 파일 모드 — DB 파일은 backend/data/ 아래 생성 (git 제외)
    url: jdbc:h2:file:./data/aitms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always   # schema.sql 추가 시 기동마다 실행 (CREATE TABLE IF NOT EXISTS 사용)
  servlet:
    multipart:
      max-file-size: 10MB     # 엑셀 업로드·증빙 첨부 (파일 1개당)
      max-request-size: 30MB
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

server:
  port: 8080
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

app:
  upload:
    dir: ./uploads            # 첨부파일 저장 루트 (backend 실행 위치 기준, git 제외) — DB에는 이 아래의 상대 경로만 저장
  security:
    registration-enabled: true    # 회원가입(POST /api/auth/register) 허용 — 외부에 노출하는 환경에서는 false
    # 비밀번호가 없는 사용자(샘플 사용자 등)에게 기동 시 넣는 초기 비밀번호 — 개발용, 운영에서는 반드시 변경/제거
    initial-password: aitms1234!
  ai:
    llm:
      enabled: false                # 비용 때문에 꺼둠. true + API 키를 설정하면 AI 생성(LLM) 추천도 실행 (꺼져 있어도 규칙기반·RAG는 정상 동작)
      model: claude-opus-5
      max-cases: 5                  # 요구사항 1건당 제안할 최대 TC 수
      api-key: ${ANTHROPIC_API_KEY:}  # 비우면 SDK 기본 인증(ANTHROPIC_API_KEY 환경변수 / ant auth login 프로필) 사용
  cors:
    allowed-origins: http://localhost:5173
