# 운영(prod) 프로파일 — SPRING_PROFILES_ACTIVE=prod 로 켬 (Dockerfile 기본값). 값 없는 항목은 application.yml 그대로 상속.
spring:
  datasource:
    # 컨테이너 안 절대경로 기본값. 영구 디스크를 붙이면 DB_PATH 환경변수만 그 마운트 경로로 바꾸면 됨(코드 변경 불필요).
    url: jdbc:h2:file:${DB_PATH:/app/data/aitms};MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=FALSE
  h2:
    console:
      enabled: false   # 운영에 콘솔을 열어두지 않음

server:
  # Render 등은 TLS를 자기 프록시에서 종료하고 내부로는 평문 HTTP로 전달 — 이 설정이 있어야
  # X-Forwarded-Proto 를 보고 요청을 '보안 연결'로 인식해서 세션/CSRF 쿠키에 Secure 플래그가 정상적으로 붙음.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
